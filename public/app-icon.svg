<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#071c4c" />
      <stop offset="100%" stop-color="#010a24" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A3FF" />
      <stop offset="100%" stop-color="#0066FF" />
    </linearGradient>

    <clipPath id="hCrossClip">
      <rect x="42" y="75" width="88" height="40" />
    </clipPath>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0080FF" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Solid Square Background -->
  <rect width="1024" height="1024" rx="180" fill="url(#bgGrad)" />

  <g transform="translate(0, 0)" filter="url(#glow)">
    <!-- 'H' -->
    <g transform="translate(125, 380)">
      <!-- Left vertical column -->
      <path d="M 0,0 L 44,0 L 44,190 L 0,190 Z" fill="#FFFFFF" />
      <!-- Right vertical column -->
      <path d="M 130,0 L 174,0 L 174,190 L 130,190 Z" fill="#FFFFFF" />
      <!-- Horizontal crossbar background -->
      <path d="M 44,75 L 130,75 L 130,115 L 44,115 Z" fill="#FFFFFF" />
      <!-- Diagonal cyan accent slice -->
      <g clip-path="url(#hCrossClip)">
        <path d="M 40,75 L 85,75 L 60,115 L 15,115 Z" fill="url(#cyanGrad)" />
      </g>
    </g>

    <!-- 'E' -->
    <g transform="translate(340, 380)">
      <path d="M 0,0 L 155,0 L 155,42 L 44,42 L 44,74 L 140,74 L 140,116 L 44,116 L 44,148 L 155,148 L 155,190 L 0,190 Z" fill="#FFFFFF" />
    </g>

    <!-- 'R' -->
    <g transform="translate(535, 380)">
      <path d="M 0,0 L 44,0 L 44,190 L 0,190 Z" fill="#FFFFFF" />
      <path d="M 44,0 L 115,0 C 160,0 170,25 170,55 C 170,85 155,105 L 44,105 L 44,63 L 115,63 C 124,63 126,42 115,42 L 44,42 Z" fill="#FFFFFF" />
      <path d="M 85,95 L 172,190 L 120,190 L 44,105 Z" fill="#FFFFFF" />
    </g>

    <!-- 'O' -->
    <g transform="translate(735, 380)">
      <circle cx="95" cy="95" r="95" fill="url(#cyanGrad)" />
      <circle cx="95" cy="95" r="52" fill="#04153C" />
    </g>

    <!-- Subtitle: — ATLAS — -->
    <g transform="translate(512, 665)">
      <!-- Left Dash Line -->
      <line x1="-370" y1="-12" x2="-210" y2="-12" stroke="url(#cyanGrad)" stroke-width="12" stroke-linecap="round" />

      <!-- ATLAS Text -->
      <text x="0" y="10" font-family="'Plus Jakarta Sans', 'Segoe UI', 'Arial', sans-serif" font-weight="900" font-size="72" fill="url(#cyanGrad)" text-anchor="middle" letter-spacing="28">ATLAS</text>

      <!-- Right Dash Line -->
      <line x1="210" y1="-12" x2="370" y2="-12" stroke="url(#cyanGrad)" stroke-width="12" stroke-linecap="round" />
    </g>
  </g>
</svg>
